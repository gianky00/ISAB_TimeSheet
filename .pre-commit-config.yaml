# Pre-commit hooks - SyncroJob Enterprise
# Install: pre-commit install
# Run all: pre-commit run --all-files
# Update: pre-commit autoupdate

default_language_version:
  python: python3.12

repos:
  # ── Housekeeping ────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements

  # ── Ruff: Linter + Formatter (sostituisce Black, Isort, Flake8) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      # Linter (con autofix) - esegui PRIMA del formatter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter (sostituisce Black)
      - id: ruff-format

  # ── Codespell: typo nel codice ──────────────────────────────
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--skip=./admin/Crea Setup/*,./admin/Crea Licenze/*,*.rtf,*.pdf,*.ico"]
        additional_dependencies: [tomli]

  # ── Deptry: dependency hygiene ──────────────────────────────
  - repo: local
    hooks:
      - id: deptry
        name: deptry
        entry: python -m deptry
        language: system
        pass_filenames: false
        args: [src]

  # ── Poetry: validate pyproject.toml ─────────────────────────
  - repo: local
    hooks:
      - id: poetry-check
        name: poetry check
        entry: poetry check
        language: system
        pass_filenames: false
        files: pyproject\.toml$
