name: Nuitka Build Pipeline

on:
  # push:
  #   branches: [ feat/nuitka-compilation ]
  workflow_dispatch:

jobs:
  build:
    name: Build with Nuitka (Windows)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Poetry & Dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install poetry==1.8.5
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true
        poetry install --no-interaction --no-root --with dev

    - name: Build with Nuitka
      shell: pwsh
      run: |
        $env:PYTHONUTF8=1
        poetry run python "admin/Crea Setup/build_dist.py" --use-nuitka --no-deploy --no-network

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: SyncroJob-Installer-Nuitka
        path: "admin/Crea Setup/Setup/*.exe"
        if-no-files-found: error

