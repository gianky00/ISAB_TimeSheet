name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, Refactor-CI-git ]
  pull_request:
    branches: [ master, main, Refactor-CI-git ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test & Quality Check
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Configure Resilience
      run: |
        pip config set global.timeout 1000
        pip config set global.retries 10
        
    - name: Install dependencies
      run: uv sync

    - name: Install project
      run: uv sync

    # CI Context Generation (Combines Ruff, Mypy and Tests)
    - name: Run Full CI Suite (Ruff, Mypy, Robust Tests)
      env:
        CI: "true"
        QT_QPA_PLATFORM: "offscreen"
        PYTEST_ADDOPTS: "-m 'not slow and not integration'"
      run: |
        uv run python devtools/cli/generate_ci_context.py


