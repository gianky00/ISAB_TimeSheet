name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, Refactor-CI-git ]
  pull_request:
    branches: [ master, main, Refactor-CI-git ]

jobs:
  test:
    name: Test & Quality Check
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.5
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Configure Resilience
      run: |
        pip config set global.timeout 1000
        pip config set global.retries 10
        poetry config installer.max-workers 2

    - name: Install dependencies
      run: poetry install --no-interaction --no-root

    - name: Install project
      run: poetry install --no-interaction

    # Linting & Static Analysis (Must Pass)
    - name: Run Ruff (Linting)
      run: poetry run ruff check .

    - name: Run Mypy (Type Checking)
      run: poetry run mypy .

    # Testing Strategy:
    # 1. We skip 'gui' and 'integration' markers on CI if they are unstable without a display.
    #    However, since we are on 'windows-latest', basic GUI tests *might* work if they don't require
    #    interaction.
    # 2. We explicitly use 'headless' mode for any Selenium logic.
    # 3. We use pytest-qt's off-screen rendering capabilities where possible.

    - name: Run Tests (Robust)
      env:
        CI: "true"
        QT_QPA_PLATFORM: "offscreen" # Crucial for Qt on CI/Headless
        PYTEST_ADDOPTS: "-m 'not slow and not integration'"
      run: |
        poetry run python tests/run_robust_tests.py

    # Optional: Upload coverage
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
