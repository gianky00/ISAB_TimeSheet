name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, Refactor-CI-git ]
  pull_request:
    branches: [ master, main, Refactor-CI-git ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test & Quality Check
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.3.4
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Configure Resilience
      run: |
        pip config set global.timeout 1000
        pip config set global.retries 10
        poetry config installer.max-workers 2

    - name: Install dependencies
      run: poetry install --no-interaction --no-root

    - name: Install project
      run: poetry install --no-interaction

    # CI Context Generation (Combines Ruff, Mypy and Tests)
    - name: Run Full CI Suite (Ruff, Mypy, Robust Tests)
      env:
        CI: "true"
        QT_QPA_PLATFORM: "offscreen"
        PYTEST_ADDOPTS: "-m 'not slow and not integration'"
      run: |
        python tools/generate_ci_context.py


