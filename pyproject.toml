[tool.poetry]
name = "syncrojob"
version = "1.0.29"
description = "ISAB TimeSheet application"
authors = ["Giancarlo Allegretti"]
packages = [
    { include = "core", from = "src" },
    { include = "gui", from = "src" },
    { include = "utils", from = "src" },
    { include = "bots", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
PyQt6 = "6.5.2"
PyQt6-Qt6 = "6.5.2"
PyQt6-sip = "13.5.2"
selenium = "4.18.1"
webdriver-manager = "4.0.1"
requests = "2.31.0"
cryptography = "42.0.5"
keyring = ">=24.3.0"
packaging = "23.2"
Pillow = "10.2.0"
pyinstaller = "6.4.0"
openpyxl = ">=3.1.5"
pandas = "2.2.1"
pyarrow = ">=15.0.0"
matplotlib = "*"
setuptools = "69.5.1"
platformdirs = "*"
msoffcrypto-tool = "*"
markdown = "*"
pymupdf = "*"
pywin32 = "*"
python-telegram-bot = "*"

[tool.poetry.group.dev.dependencies]
pytest = "8.0.2"
pytest-qt = "4.3.1"
pytest-mock = "3.12.0"
pytest-cov = "*"
black = "^25.12.0"
ruff = "^0.14.10"
scalene = "^2.0.1"
mypy = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
test = "pytest tests/ --ignore=tests/unit/test_gui_contabilita_extra.py --ignore=tests/unit/test_gui_contabilita_logic.py --ignore=tests/unit/test_gui_panels_new.py --ignore=tests/unit/test_gui_panels.py --ignore=tests/unit/test_gui_settings.py --ignore=tests/unit/test_main_window.py --ignore=tests/unit/test_ux_settings_menus.py -v --tb=short"

[tool.black]
line-length = 110

[tool.mypy]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

