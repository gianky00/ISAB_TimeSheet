[tool.poetry]
name = "syncrojob"
version = "1.15.0"
description = "ISAB TimeSheet application"
authors = ["Giancarlo Allegretti"]
packages = [
    { include = "core", from = "src" },
    { include = "gui", from = "src" },
    { include = "utils", from = "src" },
    { include = "bots", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
PyQt6 = "6.5.2"
PyQt6-Qt6 = "6.5.2"
PyQt6-sip = "13.5.2"
selenium = "4.18.1"
webdriver-manager = "4.0.1"
requests = "2.32.4"
cryptography = "46.0.5"
keyring = ">=24.3.0"
packaging = "23.2"
Pillow = "12.1.1"
pyinstaller = "6.4.0"
openpyxl = ">=3.1.5"
pandas = "2.2.1"
pyarrow = ">=15.0.0"
protobuf = "5.29.6"
matplotlib = "*"
setuptools = "78.1.1"
platformdirs = "*"
msoffcrypto-tool = "*"
markdown = "*"
pymupdf = "*"
pywin32 = { version = "*", platform = "win32" }
python-telegram-bot = "*"
pandera = "^0.28.1"
pydantic = "*"
tenacity = "*"
loguru = "*"
faker = "*"
email-validator = "*"
numpy = ">=1.26.0"
psutil = ">=5.9.0"
jaraco-text = "^4.0.0"
jaraco-context = "^6.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.0.2"
pytest-qt = "4.3.1"
pytest-mock = "3.12.0"
pytest-cov = "*"
pytest-asyncio = "*"
ruff = "^0.14.10"
scalene = "^2.0.1"
mypy = "*"
types-requests = "^2.32.4.20260107"
types-openpyxl = "^3.1.5.20250919"
types-pywin32 = "^311.0.0.20251008"
pandas-stubs = "^2.3.3.260113"
types-markdown = "^3.10.0.20251106"
hypothesis = "^6.150.2"
bandit = "^1.9.2"
vulture = "^2.14"
xenon = "^0.9.3"
deptry = "^0.24.0"
codespell = "^2.4.1"
interrogate = "^1.7.0"
pip-audit = "^2.10.0"
rich = "^14.2.0"
mkdocs-material = "^9.7.1"
mkdocstrings = {extras = ["python"], version = "^1.0.1"}
commitizen = "^4.12.0"
icecream = "^2.1.9"
diagrams = "^0.25.1"
pyarmor = "^9.2.3"
refurb = "^2.2.0"
mutatest = "^3.1.0"
eradicate = "^3.0.1"
yesqa = "^1.5.0"
pyfakefs = "^6.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# Comando per avviare l'app principale
syncrojob = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short --cov=src --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "unit: Test unitari puri (veloci, no I/O, no GUI complessa)",
    "gui: Test che istanziano widget PyQt (lenti, consumano risorse)",
    "integration: Test che toccano DB o File System reali",
    "slow: Test lenti da escludere nel dev loop rapido",
]
filterwarnings = [
    "ignore:datetime.datetime.utcnow() is deprecated:DeprecationWarning",
    "ignore::DeprecationWarning:openpyxl.*",
]

# ═══════════════════════════════════════════════════════════════
# Ruff - Linter + Formatter (sostituisce Black, Isort, Flake8)
# ═══════════════════════════════════════════════════════════════
[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "temp",
    "site",
    "htmlcov",
    "config/vulture_whitelist.py",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes (import/nome undefined)
    "I",     # isort (ordinamento import)
    "B",     # flake8-bugbear (bug comuni)
    "SIM",   # flake8-simplify (semplificazioni)
    "UP",    # pyupgrade (sintassi moderna py312)
    "C4",    # flake8-comprehensions (list/dict comp migliori)
    "PERF",  # perflint (performance antipattern)
    "FURB",  # refurb (modernizzazione codice)
    "RUF",   # regole ruff-specifiche
    "TCH",   # flake8-type-checking (import solo per type hints → TYPE_CHECKING)
    "PTH",   # flake8-use-pathlib (Path invece di os.path)
    "DTZ",   # flake8-datetimez (timezone-aware datetime)
    "RET",   # flake8-return (return inutili/mancanti)
    "PIE",   # flake8-pie (antipattern vari)
    "T20",   # flake8-print (print() rimasti nel codice)
    "LOG",   # flake8-logging (logging antipattern)
    "S",     # flake8-bandit (security checks, sostituisce bandit standalone)
]
ignore = [
    "E501",   # line-too-long: gestito dal formatter
    "RET504", # unnecessary-assign: a volte migliora leggibilita'
    "DTZ005", # datetime.now() senza tz: troppo rumoroso su codice legacy
    "T201",   # print found: il progetto usa print in script e console
    "S603",   # subprocess-without-shell-check: gestito caso per caso
    "S607",   # start-process-with-partial-path: idem
    "S608",   # hardcoded-sql-expression: gia' ignorato in [tool.bandit]
    "RUF001", # ambiguous-unicode-character-string: emoji sono intenzionali nella GUI
]

[tool.ruff.lint.per-file-ignores]
# Test: permettiamo assert, password fittizie, print, temp files e nested with
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "ANN201", "T201", "DTZ", "SIM117", "F821", "F841"]
# __init__.py: re-export senza uso diretto
"**/__init__.py" = ["F401"]
# Script e admin: meno severi
"scripts/**/*.py" = ["T201", "DTZ", "PTH", "S108"]
"admin/**/*.py" = ["T201", "DTZ", "PTH", "S108", "E402"]
# main.py: entry point
"main.py" = ["T201", "E402"]
"tools/**/*.py" = ["T201", "PTH"]
"*.py" = ["PTH"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
exclude = ["build", "dist", "config/vulture_whitelist.py", "admin", "tests", "mutants", "temp_patch_global_mutmut.py"]

# ── Strict Core ──────────────────────────────────────────────

# Ogni funzione DEVE avere type hints (elimina Any implicito)
disallow_untyped_defs = false
# Controlla anche il body delle funzioni non ancora tipizzate
check_untyped_defs = true
# Impedisce di decorare funzioni tipizzate con decoratori non tipizzati
disallow_untyped_decorators = true
# Vieta def foo(x=None) senza scrivere Optional[X] / X | None
no_implicit_optional = true

# ── Warn & Catch ─────────────────────────────────────────────
# Se una funzione ritorna Any e lo usi come tipo strutturato → errore
warn_return_any = true
# Segnala # type: ignore rimasti orfani
warn_unused_ignores = true
# Segnala variabili/importazioni con tipo ridondante
warn_redundant_casts = true
# Segnala branch che non vengono mai raggiunti secondo i tipi
warn_unreachable = true

# ── Import Safety ────────────────────────────────────────────
# NON ignorare globalmente gli import mancanti
ignore_missing_imports = false

# ── Strictness extras ───────────────────────────────────────
# Impedisce chiamate a funzioni con troppi/pochi argomenti su Any
disallow_any_generics = true
# Forza annotazione esplicita per variabili quando il tipo e' Any
disallow_any_unimported = true
strict_equality = true
extra_checks = true
show_error_codes = true
show_column_numbers = true
pretty = true

# ── Override per librerie terze SENZA type stubs ─────────────
# Regola: aggiungi qui SOLO i moduli che non hanno stubs ufficiali.
# Se esce uno stub nuovo (es. types-selenium), rimuovi la riga.

[[tool.mypy.overrides]]
module = [
    "selenium.*",
    "webdriver_manager.*",
    "PIL.*",
    "pyarrow.*",
    "matplotlib.*",
    "msoffcrypto.*",
    "fitz.*",                    # pymupdf
    "telegram.*",                # python-telegram-bot
    "pandera.*",
    "tenacity.*",
    "loguru.*",
    "faker.*",
    "pyinstaller.*",
    "PyInstaller.*",
    "platformdirs.*",
    "numpy.*",
    "psutil.*",
    "win32api.*",
    "win32con.*",
    "win32gui.*",
    "win32print.*",
    "win32ui.*",
    "pywintypes.*",
    "scalene.*",
    "icecream.*",
    "email_validator.*",
    "jaraco.*",
    "diagrams.*",
    "mutmut.*",
]
ignore_missing_imports = true

# ── Override per i test (piu' permissivo) ────────────────────
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false


[tool.deptry]
known_first_party = ["src"]
exclude = [".venv", "build", "dist", "temp", "admin", "scripts", "site", "docs", "graveyard", "mutants"]

[tool.deptry.per_rule_ignores]
# DEP001 (imported but not declared): nessuna eccezione necessaria al momento
DEP001 = ["generate_icons"]
# DEP002 (declared but not imported): meta-packages e build tools
DEP002 = [
    "pyarrow",          # backend engine per pandas, non importato direttamente
    "setuptools",       # build dependency
    "pyinstaller",      # build tool
    "PyQt6-Qt6",        # meta-package runtime di PyQt6
    "PyQt6-sip",        # meta-package SIP bindings di PyQt6
    "jaraco-text",      # dipendenza richiesta da keyring
    "jaraco-context",   # dipendenza richiesta da keyring
    "pydantic",         # usato indirettamente per validazione dati
    "tenacity",         # retry logic, usato in moduli non scansionati
    "loguru",           # logging alternativo, usato in script admin
    "faker",            # test data generation, usato nei test
    "email-validator",  # validazione email, usato via pydantic
    "protobuf",         # pinned per sicurezza (transitiva)
]
# DEP003 (transitive dependency imported directly)
DEP003 = [
    "win32con",  # parte di pywin32, importato direttamente in printing.py
]
# DEP004 (dev dependency imported): permessa nei test
DEP004 = ["pytest", "pyfakefs", "rich"]

[tool.codespell]
skip = "*.pyc,*.ico,*.qss,*.lock,*.db,*.iss,*.csv,*.js,*.html,*.css,*.map,*.pem,./build/*,./dist/*,./temp/*,./.venv/*,./.git/*,./.ruff_cache/*,./.pytest_cache/*,./.hypothesis/*,./data/*,./htmlcov/*,./claude/*,./site/*,./admin/Crea Setup/*,./admin/Crea Licenze/*"
ignore-words-list = "nome,ore,impossibile,stati,reparti,cantieri,fornitori,contratti,registrate,invalide,cliente,fase,accumulato,termine,momento,visuale,allo,rende,alle,classe,normale,visibile,ignora,configurate,comando,categorie,valide,celle,limite,installate,macchine,possibile,foto,tre,datas,distribuite,compatibile,accessibile,separato,cant,te,vai,variante,accumulare,generare,processore,somme,validata,probabile,quantit,mis,invisibile,applicato,appropriato,incluse,aggressivo,forse,incompatibile,sensibile,contro,compilate"
check-filenames = true

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
fail-under = 80
exclude = ["tests", "docs", "build", "dist", "temp", "graveyard", "site", "admin", "scripts"]
verbose = 1
quiet = false
color = true

[tool.bandit]
skips = ["B608"]
exclude = ["src/bots/safework/pdl/search_bot.py"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.15.0"
tag_format = "v$version"
version_files = [
    "src/core/version.py:__version__",
    "pyproject.toml:version"
]
