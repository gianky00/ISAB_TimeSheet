[tool.poetry]
name = "syncrojob"
version = "1.8.6"
description = "ISAB TimeSheet application"
authors = ["Giancarlo Allegretti"]
packages = [
    { include = "core", from = "src" },
    { include = "gui", from = "src" },
    { include = "utils", from = "src" },
    { include = "bots", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
PyQt6 = "6.5.2"
PyQt6-Qt6 = "6.5.2"
PyQt6-sip = "13.5.2"
selenium = "4.18.1"
webdriver-manager = "4.0.1"
requests = "2.32.4"
cryptography = "44.0.1"
keyring = ">=24.3.0"
packaging = "23.2"
Pillow = "10.3.0"
pyinstaller = "6.4.0"
openpyxl = ">=3.1.5"
pandas = "2.2.1"
pyarrow = ">=15.0.0"
matplotlib = "*"
setuptools = "78.1.1"
platformdirs = "*"
msoffcrypto-tool = "*"
markdown = "*"
pymupdf = "*"
pywin32 = { version = "*", platform = "win32" }
python-telegram-bot = "*"
pandera = "^0.28.1"
pydantic = "*"
tenacity = "*"
loguru = "*"
faker = "*"
email-validator = "*"
jaraco-text = "^4.0.0"
jaraco-context = "^6.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.0.2"
pytest-qt = "4.3.1"
pytest-mock = "3.12.0"
pytest-cov = "*"
pytest-asyncio = "*"
black = "^25.12.0"
ruff = "^0.14.10"
scalene = "^2.0.1"
mypy = "*"
types-requests = "^2.32.4.20260107"
types-openpyxl = "^3.1.5.20250919"
types-pywin32 = "^311.0.0.20251008"
pandas-stubs = "^2.3.3.260113"
types-markdown = "^3.10.0.20251106"
hypothesis = "^6.150.2"
mutmut = "^3.4.0"
bandit = "^1.9.2"
vulture = "^2.14"
xenon = "^0.9.3"
deptry = "^0.24.0"
codespell = "^2.4.1"
interrogate = "^1.7.0"
pip-audit = "^2.10.0"
rich = "^14.2.0"
mkdocs-material = "^9.7.1"
mkdocstrings = {extras = ["python"], version = "^1.0.1"}
commitizen = "^4.12.0"
icecream = "^2.1.9"
diagrams = "^0.25.1"
pyarmor = "^9.2.3"
refurb = "^2.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# Comando per avviare l'app principale
syncrojob = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.black]
line-length = 110

[tool.mypy]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
exclude = ["build", "dist", "config/vulture_whitelist.py", "admin", "tests"]
ignore_missing_imports = true
check_untyped_defs = false

[tool.deptry]
ignore = ["DEP001", "DEP002", "DEP003", "DEP004"]
known_first_party = ["src"]

[tool.codespell]
skip = "*.pyc,*.ico,*.qss,*.lock,*.db,*.iss,*.csv,*.js,*.html,*.css,*.map,*.pem,./build/*,./dist/*,./temp/*,./.venv/*,./.git/*,./.ruff_cache/*,./.pytest_cache/*,./.hypothesis/*,./data/*,./htmlcov/*,./claude/*,./site/*,./admin/Crea Setup/*,./admin/Crea Licenze/*"
ignore-words-list = "nome,ore,impossibile,stati,reparti,cantieri,fornitori,contratti,registrate,invalide,cliente,fase,accumulato,termine,momento,visuale,allo,rende,alle,classe,normale,visibile,ignora,configurate,comando,categorie,valide,celle,limite,installate,macchine,possibile,foto,tre,datas,distribuite,compatibile,accessibile,separato,cant,te,vai,variante,accumulare,generare,processore,somme,validata,probabile,quantit,mis,invisibile,applicato,appropriato,incluse,aggressivo,forse"
check-filenames = true

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
fail-under = 80
exclude = ["tests", "docs", "build", "dist", "temp", "graveyard", "site", "admin", "scripts"]
verbose = 1
quiet = false
color = true

[tool.bandit]
skips = ["B608"]
exclude = ["src/bots/safework/pdl/search_bot.py"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.8.6"
tag_format = "v$version"
version_files = [
    "src/core/version.py:__version__",
    "pyproject.toml:version"
]
