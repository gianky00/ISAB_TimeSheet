[pytest]
addopts = --cov=src --cov-report=html --cov-report=term-missing
testpaths = tests
python_files = test_*.py
markers =
    unit: Test unitari puri (veloci, no I/O, no GUI complessa)
    gui: Test che istanziano widget PyQt (lenti, consumano risorse)
    integration: Test che toccano DB o File System reali
    slow: Test lenti da escludere nel dev loop rapido
filterwarnings =
    ignore:datetime.datetime.utcnow() is deprecated:DeprecationWarning
    ignore::DeprecationWarning:openpyxl.*
