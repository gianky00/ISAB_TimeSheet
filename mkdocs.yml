site_name: SyncroJob Enterprise Docs
site_description: Documentazione tecnica per SyncroJob, l'automazione ISAB.
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Passa a modalità scura
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/weather-night
        name: Passa a modalità chiara
  features:
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true

nav:
  - Home: README.md
  - Contribuire: CONTRIBUTING.md
  - Guide per IA:
      - 'Contesto Architetturale (Machine-Readable)': resources/.ai-context.json
      - 'Guida Operativa (CLAUDE)': CLAUDE.md
      - 'Linee Guida Qualità (GEMINI)': GEMINI.md
      - 'Ottimizzazione PySide6': PYSIDE6_OPTIMIZATION.md
  - Architettura:
      - 'Piano Refactoring SRP': docs/srp_implementation_plan.md
      - 'Roadmap Refactoring': docs/REFACTORING_ROADMAP.md
  - Qualità & Testing:
      - 'Piano Linting Remediation': docs/LINTING_REMEDIATION_PLAN.md
      - 'Piano Coverage Test': docs/TESTING_COVERAGE_PLAN_MULTI_AGENT.md
      - 'TODO Qualità': docs/TODO_QUALITY.md
